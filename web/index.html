<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>تعبئة USDT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #fff;
      margin: 0;
      padding: 18px;
    }

    .box {
      max-width: 680px;
      margin: auto;
      background: #172033;
      padding: 22px;
      border-radius: 18px;
      box-shadow: 0 15px 40px #0005;
    }

    h2,
    h3 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-bottom: 5px;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 13px;
      margin: 7px 0;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0b1220;
      color: #fff;
      font-size: 15px;
    }

    button {
      cursor: pointer;
      background: #2563eb;
      border: 0;
      font-weight: 700;
    }

    button.secondary {
      background: #334155;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .muted {
      color: #94a3b8;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .card {
      background: #0b1220;
      padding: 14px;
      border-radius: 12px;
      margin-top: 12px;
    }

    .status {
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      background: #1e293b;
    }

    .ok {
      border: 1px solid #22c55e;
    }

    .bad {
      border: 1px solid #ef4444;
    }

    .address {
      word-break: break-all;
      background: #020617;
      padding: 14px;
      border-radius: 10px;
      direction: ltr;
      text-align: left;
      margin-top: 10px;
    }

    .qr {
      display: flex;
      justify-content: center;
      margin: 12px 0;
    }

    .qr img {
      width: 220px;
      height: 220px;
      background: #fff;
      padding: 8px;
      border-radius: 12px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 13px;
      min-width: 620px;
    }

    td,
    th {
      padding: 9px;
      border-bottom: 1px solid #334155;
      text-align: right;
      vertical-align: top;
    }

    .hidden {
      display: none;
    }

    .network-disabled {
      padding: 15px;
      background: #451a03;
      border: 1px solid #f59e0b;
      border-radius: 10px;
      margin-top: 12px;
    }

    @media (max-width: 600px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="box" id="authBox">

  <h2>🔐 تسجيل الدخول</h2>

  <div id="authTabs">
    <button id="tabLoginBtn" onclick="showAuthTab('login')">
      دخول
    </button>

    <button
      class="secondary"
      id="tabRegisterBtn"
      onclick="showAuthTab('register')"
    >
      حساب جديد
    </button>
  </div>

  <div id="loginForm">
    <label for="loginUsername">اسم المستخدم</label>
    <input id="loginUsername" type="text" autocomplete="username">

    <label for="loginPassword">كلمة المرور</label>
    <input id="loginPassword" type="password" autocomplete="current-password">

    <button onclick="login()">دخول</button>
  </div>

  <div id="registerForm" class="hidden">
    <label for="registerUsername">اسم المستخدم (أحرف إنجليزية وأرقام فقط)</label>
    <input id="registerUsername" type="text" autocomplete="username">

    <label for="registerEmail">البريد الإلكتروني (اختياري)</label>
    <input id="registerEmail" type="email" autocomplete="email">

    <label for="registerPassword">كلمة المرور (8 أحرف على الأقل)</label>
    <input id="registerPassword" type="password" autocomplete="new-password">

    <button onclick="register()">إنشاء حساب</button>
  </div>

  <div id="authMessage" class="status hidden"></div>

</div>

<div class="box hidden" id="appBox">

  <div class="card">
    مسجّل الدخول باسم:
    <b id="whoAmI"></b>
    &nbsp;|&nbsp;
    الرصيد:
    <b id="myBalance">-</b>
    USDT
    <button class="secondary" onclick="logout()">تسجيل الخروج</button>
  </div>

  <h2>💳 تعبئة رصيد USDT</h2>

  <p class="muted">
    تتم إضافة الرصيد من الخادم فقط بعد التحقق من
    NOWPayments وIPN.
  </p>

  <div class="grid">

    <div>
      <label for="currency">
        الشبكة
      </label>

      <select id="currency">
        <option value="">
          جاري تحميل الشبكات...
        </option>
      </select>
    </div>

    <div>
      <label for="amount">
        المبلغ
      </label>

      <input
        id="amount"
        type="number"
        min="1"
        step="0.01"
        value="10"
      >
    </div>

  </div>

  <button
    id="prepareButton"
    onclick="prepareDeposit()"
  >
    الحصول على عنوان الإيداع
  </button>

  <div
    id="networkMessage"
    class="network-disabled hidden"
  ></div>

  <div
    id="addressBox"
    class="card hidden"
  ></div>

  <div
    id="message"
    class="status"
  ></div>

  <h3>
    سجل التعبئة
  </h3>

  <button
    class="secondary"
    onclick="loadHistory()"
  >
    تحديث السجل
  </button>

  <div id="history"></div>

</div>

<script>
  /*
    JWT is issued by the backend itself via
    POST /api/auth/register or POST /api/auth/login,
    then stored here for subsequent requests.

    Do not put JWT_SECRET or NOWPAYMENTS secrets here.
  */

  /*
    The frontend is served by the same backend (Web Service),
    so API calls are same-origin. No separate domain, no CORS
    configuration needed.
  */

  const API = '';

  function getJwt() {
    return localStorage.getItem(
      'palmJwt'
    ) || '';
  }

  function setJwt(token) {
    localStorage.setItem(
      'palmJwt',
      token
    );
  }

  function clearJwt() {
    localStorage.removeItem(
      'palmJwt'
    );
  }

  function showAuthTab(tab) {
    const loginForm =
      document.getElementById(
        'loginForm'
      );

    const registerForm =
      document.getElementById(
        'registerForm'
      );

    const tabLoginBtn =
      document.getElementById(
        'tabLoginBtn'
      );

    const tabRegisterBtn =
      document.getElementById(
        'tabRegisterBtn'
      );

    if (tab === 'register') {
      loginForm.classList.add('hidden');
      registerForm.classList.remove('hidden');
      tabLoginBtn.className = 'secondary';
      tabRegisterBtn.className = '';
    } else {
      registerForm.classList.add('hidden');
      loginForm.classList.remove('hidden');
      tabRegisterBtn.className = 'secondary';
      tabLoginBtn.className = '';
    }
  }

  function showAuthMessage(text, bad = false) {
    const el =
      document.getElementById(
        'authMessage'
      );

    el.textContent = text;

    el.classList.remove('hidden');

    el.className =
      'status ' +
      (bad ? 'bad' : 'ok');
  }

  async function authApi(path, body) {
    const response =
      await fetch(
        API + path,
        {
          method: 'POST',

          headers: {
            'Content-Type':
              'application/json'
          },

          body:
            JSON.stringify(body)
        }
      );

    let data = {};

    try {
      data =
        await response.json();
    } catch {}

    if (!response.ok) {
      throw new Error(
        data.error ||
        'حدث خطأ في الخادم.'
      );
    }

    return data;
  }

  async function register() {
    try {
      const username =
        document.getElementById(
          'registerUsername'
        ).value;

      const email =
        document.getElementById(
          'registerEmail'
        ).value;

      const password =
        document.getElementById(
          'registerPassword'
        ).value;

      const result =
        await authApi(
          '/api/auth/register',
          { username, email, password }
        );

      setJwt(result.token);

      onLoggedIn(result.user);

    } catch (error) {
      showAuthMessage(
        error.message,
        true
      );
    }
  }

  async function login() {
    try {
      const username =
        document.getElementById(
          'loginUsername'
        ).value;

      const password =
        document.getElementById(
          'loginPassword'
        ).value;

      const result =
        await authApi(
          '/api/auth/login',
          { username, password }
        );

      setJwt(result.token);

      onLoggedIn(result.user);

    } catch (error) {
      showAuthMessage(
        error.message,
        true
      );
    }
  }

  function logout() {
    clearJwt();

    document.getElementById(
      'appBox'
    ).classList.add('hidden');

    document.getElementById(
      'authBox'
    ).classList.remove('hidden');
  }

  function onLoggedIn(user) {
    document.getElementById(
      'whoAmI'
    ).textContent =
      user.username;

    document.getElementById(
      'myBalance'
    ).textContent =
      user.balance;

    document.getElementById(
      'authBox'
    ).classList.add('hidden');

    document.getElementById(
      'appBox'
    ).classList.remove('hidden');

    loadNetworks();
    loadHistory();
  }

  async function tryResumeSession() {
    if (!getJwt()) {
      return;
    }

    try {
      const user =
        await api('/api/auth/me');

      onLoggedIn(user);
    } catch {
      clearJwt();
    }
  }

  function authHeaders() {
    const token =
      getJwt();

    const headers = {
      'Content-Type':
        'application/json'
    };

    if (token) {
      headers.Authorization =
        'Bearer ' + token;
    }

    return headers;
  }

  function showMessage(
    text,
    bad = false
  ) {
    const el =
      document.getElementById(
        'message'
      );

    el.textContent = text;

    el.className =
      'status ' +
      (bad ? 'bad' : 'ok');
  }

  async function api(
    path,
    options = {}
  ) {
    const response =
      await fetch(
        API + path,
        {
          ...options,

          headers: {
            ...authHeaders(),
            ...(options.headers || {})
          }
        }
      );

    let data = {};

    try {
      data =
        await response.json();
    } catch {}

    if (!response.ok) {
      throw new Error(
        data.error ||
        'حدث خطأ في الخادم.'
      );
    }

    return data;
  }

  let currentAddress = null;

  /*
    Load only networks that the backend says are supported.
  */

  async function loadNetworks() {
    const select =
      document.getElementById(
        'currency'
      );

    const message =
      document.getElementById(
        'networkMessage'
      );

    try {
      const networks =
        await api(
          '/api/deposits/networks'
        );

      select.innerHTML = '';

      if (
        !Array.isArray(networks) ||
        networks.length === 0
      ) {
        const option =
          document.createElement(
            'option'
          );

        option.value = '';

        option.textContent =
          'لا توجد شبكة إيداع مفعلة';

        select.appendChild(
          option
        );

        message.textContent =
          'ميزة Permanent Deposit Addresses غير مفعلة/غير مؤكدة في حساب NOWPayments. لا يمكن إنشاء عنوان حتى يتم تفعيل الميزة من NOWPayments.';

        message.classList.remove(
          'hidden'
        );

        document.getElementById(
          'prepareButton'
        ).disabled = true;

        return;
      }

      message.classList.add(
        'hidden'
      );

      for (const item of networks) {
        const option =
          document.createElement(
            'option'
          );

        option.value =
          item.currency;

        option.textContent =
          `USDT — ${item.network}`;

        select.appendChild(
          option
        );
      }

      document.getElementById(
        'prepareButton'
      ).disabled = false;

    } catch (error) {

      select.innerHTML =
        '<option value="">تعذر تحميل الشبكات</option>';

      message.textContent =
        error.message;

      message.classList.remove(
        'hidden'
      );

      document.getElementById(
        'prepareButton'
      ).disabled = true;
    }
  }

  async function prepareDeposit() {
    try {

      if (!getJwt()) {
        showMessage(
          'انتهت الجلسة، يرجى تسجيل الدخول من جديد.',
          true
        );

        return;
      }

      const currency =
        document.getElementById(
          'currency'
        ).value;

      if (!currency) {
        showMessage(
          'لا توجد شبكة متاحة حاليًا.',
          true
        );

        return;
      }

      const amount =
        Number(
          document.getElementById(
            'amount'
          ).value
        );

      if (
        !Number.isFinite(amount) ||
        amount < 1
      ) {
        showMessage(
          'أدخل مبلغًا صحيحًا.',
          true
        );

        return;
      }

      /*
        Ask backend for the real address.
      */

      const address =
        await api(
          '/api/me/deposit-address?currency=' +
          encodeURIComponent(
            currency
          )
        );

      /*
        QR is generated by backend from the verified address.
      */

      const qr =
        await api(
          '/api/me/deposit-qr?currency=' +
          encodeURIComponent(
            currency
          )
        );

      currentAddress =
        address;

      const box =
        document.getElementById(
          'addressBox'
        );

      box.classList.remove(
        'hidden'
      );

      box.innerHTML = '';

      const title =
        document.createElement(
          'b'
        );

      title.textContent =
        'الشبكة: ' +
        address.network;

      box.appendChild(
        title
      );

      const qrContainer =
        document.createElement(
          'div'
        );

      qrContainer.className =
        'qr';

      const qrImage =
        document.createElement(
          'img'
        );

      qrImage.alt =
        'QR Code';

      qrImage.src =
        qr.qr;

      qrContainer.appendChild(
        qrImage
      );

      box.appendChild(
        qrContainer
      );

      const addressTitle =
        document.createElement(
          'div'
        );

      addressTitle.textContent =
        'عنوان الإيداع:';

      box.appendChild(
        addressTitle
      );

      const addressEl =
        document.createElement(
          'div'
        );

      addressEl.className =
        'address';

      addressEl.textContent =
        address.address;

      box.appendChild(
        addressEl
      );

      const copyButton =
        document.createElement(
          'button'
        );

      copyButton.textContent =
        'نسخ العنوان';

      copyButton.onclick =
        async () => {
          await navigator.clipboard
            .writeText(
              address.address
            );

          showMessage(
            'تم نسخ عنوان الإيداع.'
          );
        };

      box.appendChild(
        copyButton
      );

      const createButton =
        document.createElement(
          'button'
        );

      createButton.textContent =
        'إنشاء طلب تعبئة';

      createButton.onclick =
        createDeposit;

      box.appendChild(
        createButton
      );

      showMessage(
        'استخدم نفس الشبكة تمامًا عند إرسال USDT.'
      );

    } catch (error) {

      showMessage(
        error.message,
        true
      );
    }
  }

  async function createDeposit() {
    try {

      if (!currentAddress) {
        showMessage(
          'احصل على عنوان الإيداع أولًا.',
          true
        );

        return;
      }

      const currency =
        document.getElementById(
          'currency'
        ).value;

      const amount =
        Number(
          document.getElementById(
            'amount'
          ).value
        );

      /*
        Only amount/request information is sent.

        It does NOT add balance.
      */

      const deposit =
        await api(
          '/api/deposits/create',
          {
            method: 'POST',

            body:
              JSON.stringify({
                currency,
                amount
              })
          }
        );

      showMessage(
        'تم إنشاء طلب التعبئة: ' +
        deposit.id +
        '. انتظر تحديث NOWPayments.'
      );

      await loadHistory();

    } catch (error) {

      showMessage(
        error.message,
        true
      );
    }
  }

  async function loadHistory() {
    try {

      if (!getJwt()) {
        showMessage(
          'انتهت الجلسة، يرجى تسجيل الدخول من جديد.',
          true
        );

        return;
      }

      const rows =
        await api(
          '/api/deposits'
        );

      const history =
        document.getElementById(
          'history'
        );

      if (
        !Array.isArray(rows) ||
        rows.length === 0
      ) {
        history.innerHTML =
          '<p class="muted">لا توجد عمليات تعبئة.</p>';

        return;
      }

      const table =
        document.createElement(
          'table'
        );

      const thead =
        document.createElement(
          'thead'
        );

      thead.innerHTML = `
        <tr>
          <th>Deposit ID</th>
          <th>المبلغ</th>
          <th>الشبكة</th>
          <th>العنوان</th>
          <th>التاريخ</th>
          <th>الحالة</th>
          <th>TxHash</th>
          <th>Payment ID</th>
        </tr>
      `;

      table.appendChild(
        thead
      );

      const tbody =
        document.createElement(
          'tbody'
        );

      for (const item of rows) {

        const tr =
          document.createElement(
            'tr'
          );

        tr.innerHTML = `
          <td style="direction:ltr">
            ${escapeHtml(
              item.id || '-'
            )}
          </td>

          <td>
            ${escapeHtml(
              item.amount ??
              item.requested_amount ??
              '-'
            )}
          </td>

          <td>
            ${escapeHtml(
              item.network || '-'
            )}
          </td>

          <td
            style="
              direction:ltr;
              word-break:break-all;
            "
          >
            ${escapeHtml(
              item.pay_address || '-'
            )}
          </td>

          <td>
            ${escapeHtml(
              formatDate(
                item.created_at
              )
            )}
          </td>

          <td>
            ${escapeHtml(
              item.status || '-'
            )}
          </td>

          <td
            style="
              direction:ltr;
              word-break:break-all;
            "
          >
            ${escapeHtml(
              item.tx_hash || '-'
            )}
          </td>

          <td
            style="
              direction:ltr;
              word-break:break-all;
            "
          >
            ${escapeHtml(
              item.payment_id || '-'
            )}
          </td>
        `;

        tbody.appendChild(
          tr
        );
      }

      table.appendChild(
        tbody
      );

      history.innerHTML = '';

      const wrapper =
        document.createElement(
          'div'
        );

      wrapper.className =
        'table-wrap';

      wrapper.appendChild(
        table
      );

      history.appendChild(
        wrapper
      );

    } catch (error) {

      showMessage(
        error.message,
        true
      );
    }
  }

  function formatDate(value) {
    if (!value) {
      return '-';
    }

    try {
      return new Date(
        value
      ).toLocaleString(
        'ar'
      );
    } catch {
      return String(
        value
      );
    }
  }

  function escapeHtml(value) {
    return String(value)
      .replaceAll(
        '&',
        '&amp;'
      )
      .replaceAll(
        '<',
        '&lt;'
      )
      .replaceAll(
        '>',
        '&gt;'
      )
      .replaceAll(
        '"',
        '&quot;'
      )
      .replaceAll(
        "'",
        '&#039;'
      );
  }

  tryResumeSession();
</script>

</body>
</html>
