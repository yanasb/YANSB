<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تعبئة الرصيد</title>
<style>body{font-family:Arial,sans-serif;background:#0f172a;color:#fff;margin:0;padding:24px}.box{max-width:560px;margin:auto;background:#172033;padding:24px;border-radius:18px}input,select,button{width:100%;box-sizing:border-box;padding:13px;margin:8px 0;border-radius:10px;border:1px solid #334155;background:#0b1220;color:#fff}button{cursor:pointer;background:#2563eb;border:0}.address{word-break:break-all;background:#0b1220;padding:14px;border-radius:10px}.status{margin-top:12px;padding:12px;border-radius:10px;background:#1e293b}</style></head>
<body><div class="box"><h2>💳 تعبئة الرصيد</h2><label>معرّف المستخدم</label><input id="userId" value="demo-user-1"><label>الشبكة / العملة</label><select id="currency"><option value="usdttrc20">USDT TRC20</option><option value="usdtbsc">USDT BEP20</option><option value="usdt">USDT ERC20</option><option value="usdtsol">USDT Solana</option></select><button onclick="getAddress()">الحصول على عنوان الإيداع</button><div id="out"></div><hr><label>مبلغ التعبئة المتوقع</label><input id="amount" type="number" min="1" step="0.01" value="10"><button onclick="createDeposit()">إنشاء طلب تعبئة</button><div id="status" class="status"></div></div>
<script>
const API=''; let currentAddress=null;
async function getAddress(){const u=userId.value.trim(),c=currency.value; const r=await fetch(`${API}/api/users/${encodeURIComponent(u)}/deposit-address?currency=${encodeURIComponent(c)}`);const d=await r.json();if(!r.ok)return status.textContent=d.error||'خطأ';currentAddress=d.address;out.innerHTML=`<p>عنوان الإيداع الخاص بالمستخدم:</p><div class="address">${d.address}</div><p>Payment ID: ${d.payment_id||'-'}</p>`;}
async function createDeposit(){const u=userId.value.trim(),c=currency.value,a=Number(amount.value);const r=await fetch(`${API}/api/deposits`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:u,currency:c,amount:a})});const d=await r.json();status.textContent=r.ok?`تم إنشاء طلب ${d.id}. أرسل USDT إلى العنوان الظاهر أعلاه، وسيتم تحديث الرصيد بعد تأكيد الدفع.`:(d.error||'خطأ');}
</script></body></html>
